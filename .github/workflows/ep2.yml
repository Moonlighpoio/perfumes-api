name: EP2 CI/CD - Perfumes API

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.25.0"
  IMAGE_NAME: ghcr.io/moonlighpoio/perfumes-api

jobs:
  # -------------------------------------------------------------------------
  # 1. Calidad: lint + pruebas unitarias + umbral de cobertura
  # -------------------------------------------------------------------------
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar ESLint
        run: pnpm lint

      - name: Ejecutar pruebas con cobertura (umbral bloqueante)
        run: pnpm test:ci

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------------------
  # 2. Seguridad: audit de dependencias + Snyk (si hay token)
  # -------------------------------------------------------------------------
  security:
    name: Seguridad
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditar dependencias de producción (bloqueante)
        run: pnpm audit --prod --audit-level=high

      - name: Análisis con Snyk (si SNYK_TOKEN está configurado)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "::warning title=Snyk omitido::SNYK_TOKEN no está configurado. Se mantienen activos pnpm audit y Trivy."
            exit 0
          fi
          npm install -g snyk@1.1308.3
          snyk test --prod --severity-threshold=high --all-projects

          # Snyk Code (SAST) requiere que la organización lo tenga habilitado.
          # Si no está activo, se advierte pero no se bloquea el pipeline:
          # Snyk Open Source y Trivy siguen siendo gates obligatorios.
          set +e
          code_output=$(snyk code test --severity-threshold=high 2>&1)
          code_status=$?
          set -e
          echo "$code_output"
          if [ "$code_status" -ne 0 ]; then
            if echo "$code_output" | grep -q "Snyk Code is not enabled"; then
              echo "::warning title=Snyk Code no habilitado::Activa Snyk Code en la organización para el análisis SAST. Snyk Open Source y Trivy siguen bloqueando."
            else
              exit "$code_status"
            fi
          fi

  # -------------------------------------------------------------------------
  # 3. Imagen: build + escaneo de vulnerabilidades + push a GHCR
  # -------------------------------------------------------------------------
  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
    timeout-minutes: 20

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Definir tag inmutable (SHA del commit)
        id: meta
        run: echo "tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            .

      - name: Escanear imagen con Trivy (bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Subir resultados de seguridad a GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Guardar imagen como artefacto
        run: |
          docker save \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            -o image.tar

      - name: Publicar artefacto de imagen
        uses: actions/upload-artifact@v7
        with:
          name: perfumes-api-image
          path: image.tar
          if-no-files-found: error
          retention-days: 7

      - name: Publicar imagen en GHCR
        id: publish
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          fi

      - name: Advertir si GHCR no está habilitado
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=GHCR::No se pudo publicar la imagen. Ejecuta scripts/configure-repo.sh o habilita 'Read and write permissions' en Settings > Actions > General."
          echo "El despliegue continuará usando el artefacto inmutable de este run."

  # -------------------------------------------------------------------------
  # 4. Despliegue simulado en entorno cloud (Docker Compose + Nginx)
  # -------------------------------------------------------------------------
  deploy:
    name: Despliegue
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    timeout-minutes: 15

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: http://localhost:3000

    env:
      IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
      APP_VERSION: "2.0.0"
      GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Descargar imagen construida
        uses: actions/download-artifact@v8
        with:
          name: perfumes-api-image

      - name: Cargar imagen en Docker
        run: docker load -i image.tar

      - name: Levantar entorno orquestado
        run: docker compose up -d --no-build --wait

      - name: Verificar contenedores
        run: docker compose ps

      - name: Verificar escalamiento (3 réplicas de la API)
        run: |
          count=$(docker ps \
            --filter "label=com.docker.compose.project=perfumes-ep2" \
            --filter "label=com.docker.compose.service=api" \
            --filter "status=running" -q | wc -l | tr -d ' ')
          echo "Réplicas de la API en ejecución: ${count}"
          test "${count}" -ge 3

      - name: Ejecutar smoke tests contra el gateway
        run: BASE_URL=http://localhost:3000 node scripts/smoke-test.mjs

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color

      - name: Detener entorno
        if: always()
        run: docker compose down -v --remove-orphans

  # -------------------------------------------------------------------------
  # 5. Release/tag automático en main (trazabilidad versión -> commit)
  # -------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Crear tag y release si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Perfumes API $TAG" \
              --generate-notes
          fi
