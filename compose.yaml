name: perfumes-ep2

# Estrategia de orquestación:
# - 3 réplicas de la API detrás de un gateway Nginx (balanceo + aislamiento de red).
# - Límites de CPU/memoria, healthchecks, filesystem de solo lectura y cap_drop.
# - El gateway es el único servicio publicado al exterior.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-2.0.0}
        COMMIT: ${GIT_COMMIT:-local}

    image: ${IMAGE_TAG:-perfumes-api:local}

    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-2.0.1}
      REDIS_URL: redis://redis:6379

    expose:
      - "3000"

    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped
    init: true
    stop_grace_period: 10s

    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - backend

  redis:
    image: redis:7.4-alpine

    command: ["redis-server", "--appendonly", "no", "--save", ""]

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

    restart: unless-stopped

    tmpfs:
      - /data
      - /tmp

    security_opt:
      - no-new-privileges:true

    networks:
      - backend

  gateway:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine

    ports:
      - "3000:8080"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      api:
        condition: service_healthy

    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    networks:
      - backend

networks:
  backend:
    driver: bridge
