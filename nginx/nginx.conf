worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 1m;

    # Directorios temporales en /tmp (tmpfs) para poder usar filesystem read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # DNS interno de Docker para mantener actualizadas las IPs de las réplicas.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Afinidad por IP: un mismo cliente siempre llega a la misma réplica,
    # manteniendo consistencia de escrituras en el catálogo en memoria.
    upstream perfumes_api {
        zone perfumes_api 64k;
        ip_hash;
        server api:3000 resolve;
    }

    server {
        listen 8080;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location / {
            proxy_pass http://perfumes_api;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }
}
